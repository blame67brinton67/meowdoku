<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeowDoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/game-fixes.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button id="home-button" class="brand" aria-label="返回首頁"><span>◒</span> MeowDoku</button>
      <div class="player-name"><label for="player-name">玩家</label><input id="player-name" maxlength="20" placeholder="輸入暱稱" /></div>
      <button id="admin-button" class="quiet-button">管理關卡</button><button id="mute-button" class="quiet-button" aria-label="音效開關">🔊</button>
    </header>
    <section id="view" aria-live="polite"></section>
  </main>
  <dialog id="admin-dialog">
    <form id="admin-form" method="dialog" class="dialog-card">
      <button type="button" class="close" aria-label="關閉">×</button>
      <p class="eyebrow">ADMIN STUDIO</p><h2>建立單人關卡</h2>
      <label>管理密鑰<input id="admin-key" type="password" required /></label>
      <label>關卡名稱<input id="level-name" maxlength="40" placeholder="例如：午後曬太陽" required /></label>
      <label>地圖尺寸<select id="level-size"><option value="7" selected>7 × 7</option><option value="8">8 × 8</option><option value="9">9 × 9</option><option value="10">10 × 10</option></select></label>
      <button class="primary" id="publish-level" value="default">產生並發布唯一解關卡</button>
      <p id="admin-message" class="message"></p>
    </form>
  </dialog>
  <script src="/socket.io/socket.io.js"></script><script src="/sfx.js"></script><script src="/app.js"></script>
</body>
</html>
