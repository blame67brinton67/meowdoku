<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeowDoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/game-fixes.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button id="home-button" class="brand" aria-label="返回首頁"><span>◒</span> MeowDoku</button>
      <div class="player-name"><label for="player-name">玩家</label><input id="player-name" maxlength="20" placeholder="輸入暱稱" /></div>
      <button id="auth-button" class="quiet-button">登入 / 註冊</button><span id="account" class="account" hidden><span id="account-avatar"></span><strong id="account-name"></strong><button id="logout-button" class="quiet-button">登出</button></span><button id="profile-button" class="quiet-button">個人主頁</button><button id="theme-button" class="quiet-button">外觀</button><button id="admin-button" class="quiet-button" hidden>管理關卡</button><button id="mute-button" class="quiet-button" aria-label="音效開關">🔊</button>
    </header>
    <section id="view" aria-live="polite"></section>
  </main>
  <dialog id="admin-dialog" class="admin-dialog">
    <form id="admin-form" method="dialog" class="dialog-card" data-tab="generate">
      <button type="button" class="close" aria-label="關閉">×</button>
      <p class="eyebrow">ADMIN STUDIO</p><h2>管理單人關卡</h2>
      <div class="auth-tabs"><button type="button" class="auth-tab active" data-admin-tab="generate">產生地圖</button><button type="button" class="auth-tab" data-admin-tab="import">自訂地圖</button><button type="button" class="auth-tab" data-admin-tab="order">關卡順序</button></div>
      <section class="admin-pane" data-admin-pane="generate">
        <label>關卡名稱<input id="level-name" maxlength="40" placeholder="例如：午後曬太陽" /></label>
        <label>地圖尺寸<select id="level-size"><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="7" selected>7 × 7</option><option value="8">8 × 8</option><option value="9">9 × 9</option><option value="10">10 × 10</option><option value="11">11 × 11</option><option value="12">12 × 12</option></select></label>
        <button class="primary" id="publish-level" value="default">產生並發布唯一解關卡</button>
      </section>
      <section class="admin-pane" data-admin-pane="import" hidden>
        <label>關卡名稱<input id="import-name" maxlength="40" placeholder="例如：手繪的小巷" /></label>
        <label>地圖尺寸<select id="import-size"><option value="" selected>依地圖行數</option><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="7">7 × 7</option><option value="8">8 × 8</option><option value="9">9 × 9</option><option value="10">10 × 10</option><option value="11">11 × 11</option><option value="12">12 × 12</option></select></label>
        <label>地圖文字<textarea id="map-text" rows="8" placeholder="前 N 行是每格的區域編號（1–N），最後一行是每行貓咪所在的列"></textarea></label>
        <p class="hint">先「檢驗」會列出所有不合法之處，不會發布；確認沒問題再發布。</p>
        <div class="admin-actions"><button type="button" class="quiet-button" id="validate-level">只檢驗</button><button type="button" class="primary" id="import-level">檢驗並發布</button></div>
      </section>
      <section class="admin-pane" data-admin-pane="order" hidden>
        <p class="hint">拖曳或用 ▲▼ 調整順序；玩家必須先過前一關才能解鎖下一關，已通關的關卡不受影響。</p>
        <ol id="level-order" class="level-order"></ol>
        <div class="admin-actions"><button type="button" class="quiet-button" id="reload-order">還原</button><button type="button" class="primary" id="save-order">儲存順序</button></div>
      </section>
      <ul id="admin-errors" class="admin-errors" hidden></ul>
      <div id="admin-preview" class="admin-preview" hidden></div>
      <p id="admin-message" class="message"></p>
    </form>
  </dialog>
  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog" class="dialog-card" data-mode="login">
      <button type="button" class="close" aria-label="關閉">×</button>
      <p class="eyebrow">ACCOUNT</p><h2>讓貓咪認得你</h2>
      <div class="auth-tabs"><button type="button" class="auth-tab active" data-auth-tab="login">登入</button><button type="button" class="auth-tab" data-auth-tab="register">註冊</button></div>
      <label>帳號<input id="auth-username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]{3,20}" placeholder="3–20 個英數字、_ 或 -" required /></label>
      <label>密碼<input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="72" placeholder="8–72 個字元" required /></label>
      <button class="primary" id="auth-submit" value="default">登入</button>
      <p id="guest-notice" class="hint"></p>
      <p id="auth-message" class="message"></p>
    </form>
  </dialog>
  <dialog id="theme-dialog">
    <form id="theme-form" method="dialog" class="dialog-card">
      <button type="button" class="close" aria-label="關閉">×</button>
      <p class="eyebrow">APPEARANCE</p><h2>自訂顏色</h2>
      <fieldset class="theme-presets"><legend>棋盤主題</legend><div id="theme-preset-list" role="radiogroup"></div><p class="theme-preset-hint" id="theme-preset-hint"></p></fieldset>
      <fieldset class="theme-colors"><legend>區域顏色（N × N 會使用前 N 種）</legend><label>顏色 1<input type="color" data-theme-palette="0" /></label><label>顏色 2<input type="color" data-theme-palette="1" /></label><label>顏色 3<input type="color" data-theme-palette="2" /></label><label>顏色 4<input type="color" data-theme-palette="3" /></label><label>顏色 5<input type="color" data-theme-palette="4" /></label><label>顏色 6<input type="color" data-theme-palette="5" /></label><label>顏色 7<input type="color" data-theme-palette="6" /></label><label>顏色 8<input type="color" data-theme-palette="7" /></label><label>顏色 9<input type="color" data-theme-palette="8" /></label><label>顏色 10<input type="color" data-theme-palette="9" /></label><label>顏色 11<input type="color" data-theme-palette="10" /></label><label>顏色 12<input type="color" data-theme-palette="11" /></label></fieldset>
      <label>棋盤格線顏色<input type="color" data-theme-key="boardLine" /></label>
      <label>頁面背景顏色<input type="color" data-theme-key="paper" /></label>
      <button type="button" class="link-button" id="reset-theme">重設</button>
    </form>
  </dialog>
  <script src="/socket.io/socket.io.js"></script><script src="/sfx.js"></script><script src="/themes.js"></script><script src="/app.js"></script>
</body>
</html>
